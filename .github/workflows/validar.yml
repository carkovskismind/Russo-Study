name: Revisar mazos
on:
  push:
    paths: ["data/**", "tools/**"]
  pull_request:
    paths: ["data/**", "tools/**"]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validar.mjs
