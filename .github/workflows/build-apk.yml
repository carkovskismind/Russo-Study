name: Construir APK

# APK de depuración de la beta de Russo Study (envoltorio Capacitor que abre
# https://carkovskismind.github.io/Russo-Study/beta/). No lleva llaves secretas:
# se firma con la llave de depuración que Gradle crea en el runner.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # solo para adjuntar el .apk a un release publicado

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # El paquete «tools» que se instala por defecto ya no existe y hacía fallar el paso.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Construir APK de depuración
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nombrar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk russo-study-beta.apk

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: russo-study-beta-apk
          path: android-app/russo-study-beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" russo-study-beta.apk --clobber
