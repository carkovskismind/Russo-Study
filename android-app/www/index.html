<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Russo Study Beta</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b0c; color: #f3efe6; font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center;
  }
  main { max-width: 320px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .ya { font-size: 56px; font-weight: 800; color: #4af2d5; line-height: 1; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: #a3a3aa; }
  button {
    min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #4af2d5; color: #0b0b0c;
    font: inherit; font-weight: 800; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #f3efe6; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="ya" lang="ru" aria-hidden="true">Я</div>
  <h1>Sin conexión</h1>
  <p>Russo Study Beta necesita internet para abrirse. Conéctate a una red y vuelve a intentarlo.</p>
  <button type="button" id="retry">Reintentar</button>
</main>
<script>
  document.getElementById("retry").addEventListener("click", function () {
    location.href = "https://carkovskismind.github.io/Russo-Study/beta/";
  });
</script>
</body>
</html>
